<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>AI Boardroom</h2>

        <ul>
            <li>🏠 Dashboard</li>
            <li>🏢 Digital Twin</li>
            <li>🤖 AI Boardroom</li>
            <li>🗣 Debate</li>
            <li>📊 Analytics</li>
            <li>📄 Reports</li>

    </aside>

    <main class="content">

        <h1>My Profile</h1>

        <div class="profile-card">

            <img src="images/profile.png" alt="Profile">

            <h2>John Anderson</h2>

            <div class="profile-info">
                <p><strong>Email:</strong> john@company.com</p>
                <p><strong>Company:</strong> ABC Technologies</p>
                <p><strong>Role:</strong> Administrator</p>
                <p><strong>Last Login:</strong> Today 09:30 AM</p>

            <button>Edit Profile</button>

        </div>

    </main>
