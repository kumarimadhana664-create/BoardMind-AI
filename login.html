<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | BoardMind-AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-logo">
            🤖
        </div>

        <h1>BoardMind-AI</h1>

        <p class="login-subtitle">
            Intelligent Business Decision System
        </p>


        <form method="POST" action="/login">

            <div class="login-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            {% if error %}

            <p class="login-error">
                {{ error }}
            </p>

            {% endif %}


            <button
                type="submit"
                class="login-btn">

                Login →

            </button>

        </form>


        <p class="login-footer">
            AI-powered business intelligence
        </p>

    </div>

</div>

</body>

</html>
